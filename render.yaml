# Render Blueprint — deploy SAMS (runtime + built SPA) as a single Docker service.
# https://render.com/docs/blueprint-spec  ·  "New → Blueprint" and point it at this repo.
# The one container serves both the API and the Vite build (see Dockerfile); the
# server binds to Render's injected $PORT. Secrets are left unset (sync:false) —
# fill them in the Render dashboard after the first deploy.
# A variable that is set wins over the app's Settings and locks that field in the
# UI: optional behaviour (base branch, PRs, approval) is left unset so it stays
# editable in ⚙. Only the provider is fixed, on purpose (OpenRouter).
#
# Plan: free. A free service has no persistent disk: its files are wiped on every
# deploy, restart or spin-down (after ~15 min without traffic; waking up takes about a
# minute). So:
# - data (accounts, sessions, chat, world, routines, history) and the choices made in
#   ⚙ (model, repo, approval…) live in an external MySQL 8: SAMS_DB_URL is REQUIRED.
#   With SAMS_EPHEMERAL_DISK=1 and no SAMS_DB_URL the runtime refuses to start;
# - keys and tokens never go in the database: set them below as variables (⚙ shows
#   them read-only, with a notice);
# - routines run inside the server: while it sleeps they don't fire;
# - outbound SMTP ports (25/465/587) are blocked on free: use Resend for email.
# Variables marked sync:false are asked for only when the Blueprint is first created;
# on an existing service add them by hand in the Environment tab. See docs/DEPLOY.md.
services:
  - type: web
    name: sams
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # No persistent disk: keys only from the environment, data only in MySQL.
      - key: SAMS_EPHEMERAL_DISK
        value: "1"
      # MySQL 8 (e.g. mysql://user:password@host:3306/db?ssl-mode=REQUIRED). Required.
      - key: SAMS_DB_URL
        sync: false
      # CA certificate (PEM text) for providers with their own CA, e.g. Aiven.
      - key: SAMS_DB_SSL_CA
        sync: false
      # Render's proxy appends the client IP to X-Forwarded-For: trust exactly that one
      # hop, so per-IP limits see the real client. Never more than the proxies in
      # front (or "true"): the client could pick its own IP. Check with
      # GET /api/admin/client-ip (owner).
      - key: SAMS_TRUST_PROXY
        value: "1"
      # Public address of the deploy (e.g. https://sams.onrender.com): reset and
      # verification links are built from it. Without it they point to localhost.
      - key: SAMS_PUBLIC_URL
        sync: false
      # AI provider — set the key of the chosen one. Default engine is OpenRouter.
      - key: SAMS_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional: model id (defaults to the provider's own default). Setting it here
      # makes the field read-only in the UI.
      - key: SAMS_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # "Accedi con GitHub": every user connects their own GitHub and picks one of their
      # repos; the tasks they assign work there, with their token. Needs a GitHub OAuth
      # App whose callback is <SAMS_PUBLIC_URL>/api/github/callback (see docs/DEPLOY.md).
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Encrypts the users' GitHub tokens in the database. Never change it once users have
      # connected (they would have to connect again). Generated on Blueprint creation.
      - key: SAMS_SECRET_KEY
        generateValue: true
      # Server's own GitHub — optional fallback. With the OAuth App set, it is used only by
      # scripts with static tokens and server-side jobs (routines, sim, webhooks): users
      # always work on their own repo. Leave GITHUB_REPO unset to keep it editable in ⚙.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      # Optional (defaults: main, PRs on, no approval). Set only to lock them.
      - key: GITHUB_BASE_BRANCH
        sync: false
      - key: SAMS_OPEN_PRS
        sync: false
      - key: SAMS_REQUIRE_APPROVAL
        sync: false
      # Security. Roles are enforced as soon as the first account is registered
      # (the first one becomes owner), even without these static tokens: register
      # right after the first deploy. The tokens are for scripts and integrations.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SAMS_TOKEN
        sync: false
      - key: SAMS_EDITOR_TOKEN
        sync: false
      - key: SAMS_READONLY_TOKEN
        sync: false
      # Email (reset and verification links). On the free plan outbound SMTP ports are
      # blocked: use Resend. With no channel, links are only written to the server log.
      - key: SAMS_MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Notion (optional)
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_PAGE_ID
        sync: false
