name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Install server deps
        run: npm ci --prefix server

      - name: Typecheck server
        run: npm --prefix server run typecheck

      - name: Test server (with coverage)
        run: npm --prefix server run test:coverage
